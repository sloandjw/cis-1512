<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ArcadeHub - Leaderboard</title>
  <script src="shared/shared.js" defer></script>
  <link rel="stylesheet" href="shared/shared.css">
</head>
<body class="centered" style="padding-bottom: 100px;">

  <h1 style="font-size: 3.5rem; margin-bottom: 0;">Leaderboard</h1>

  <div class="leaderboard-row">
    <!-- Memory Leaderboard -->
    <section class="leaderboard-section">
      <h2>Memory</h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Turns</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody id="memory-leaderboard-body">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- Snake Leaderboard -->
    <section class="leaderboard-section">
      <h2>Snake</h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>High Score</th>
          </tr>
        </thead>
        <tbody id="snake-leaderboard-body">
          <tr><td colspan="3">Loading...</td></tr>
        </tbody>
      </table>
    </section>
    
    <!-- Tic-Tac-Toe Leaderboard -->
    <section class="leaderboard-section">
      <h2>Tic-Tac-Toe</h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
          </tr>
        </thead>
        <tbody id="ttt-leaderboard-body">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <a href="hub.html" class="button" style="margin: 2rem auto; font-size: 28px; padding: 14px 28px;">Back to Hub</a>

</body>
</html>
