<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ArcadeHub - Leaderboard</title>
  <script src="shared/shared.js" defer></script>
  <link rel="stylesheet" href="shared/shared.css">
</head>
<body class="centered">

  <h1>Leaderboard</h1>

  <div class="leaderboard-row">

    <!-- Tic-Tac-Toe Leaderboard -->
    <section class="leaderboard-section">
      <h2>Tic-Tac-Toe</h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
          </tr>
        </thead>
        <tbody id="ttt-leaderboard-body">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- Snake Leaderboard -->
    <section class="leaderboard-section">
      <h2>Snake</h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>High Score</th>
          </tr>
        </thead>
        <tbody id="snake-leaderboard-body">
          <tr><td colspan="3">Loading...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- Memory Leaderboard -->
    <section class="leaderboard-section">
      <h2>Memory</h2>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Best Turns</th>
          </tr>
        </thead>
        <tbody id="memory-leaderboard-body">
          <tr><td colspan="3">Loading...</td></tr>
        </tbody>
      </table>
    </section>

  </div>

  <a href="hub.html" class="button corner-btn corner-left">Back to Hub</a>

</body>
</html>
