<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArcadeHub</title>
  <script src="../shared/shared.js" defer></script>
  <script src="tictactoe.js" defer></script>
  <link rel="stylesheet" href="../shared/shared.css">
</head>
<body class="centered">

  <div id="start-screen" class="centered" style="height:100vh;">
    <h1>Tic-Tac-Toe</h1>
    <h2>You are X. CPU is O.</h2>
    <button id="start-btn" class="play-btn">Play</button>
  </div>

  <div id="game-screen" style="display:none;">
    <div class="centered">
      <h1>Tic-Tac-Toe</h1>
      <p id="scoreboard" style="border: 2px solid white; outline: 2px solid #4488ff; padding: 8px 16px; border-radius: 8px;">Wins: 0 | Losses: 0 | Draws: 0</p>
      <div class="board" id="board"></div>
      <div id="status"></div>
      <button id="play-again" class="play-btn" style="font-size:36px; padding:16px 40px; display:none;">Play Again</button>
    </div>
    <!-- <div class="board" id="board"></div> -->
    <div id="status"></div>
  </div>

  <a href="../hub.html" class="button corner-btn corner-left">Back to Hub</a>

</body>
</html>
