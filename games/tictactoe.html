<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ArcadeHub</title>
  <script src="../shared/shared.js" defer></script>
  <script src="tictactoe.js" defer></script>
  <link rel="stylesheet" href="../shared/shared.css">
</head>
<body class="centered">
  <div class="game-container"></div>
    <h1>Tic-Tac-Toe</h1>
  </div>
  <div id="status">Player X's turn. Click a cell to make a move!</div>
  <div class="board" id="board">
    <div class="row">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
    </div>
    <div class="row">
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
    </div>
    <div class="row">
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
  </div>
  <a href="../hub.html" class="button">Back to Hub</a>

</body>
</html>
