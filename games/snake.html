<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ArcadeHub - Snake</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
        }
        
        .score-row {
            display: flex;
            gap: 2rem;
        }
        
        .score-box {
            background: #1a1a2e;
            border: 2px solid #4a4a6a;
            border-radius: 8px;
            padding: 0.5rem 1.5rem;
            text-align: center;
        }
        
        .score-box span {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }
        
        .game-screen {
            width: 400px;
            height: 400px;
            background: #0a0a15;
            border: 3px solid #4a4a6a;
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: #666;
            font-style: italic;
        }
        
        .game-description {
            max-width: 400px;
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body class="centered">
    <h1>Snake</h1>
    
    <div class="game-container">
        <div class="score-row">
            <div class="score-box">
                Score
                <span id="current-score">0</span>
            </div>
            <div class="score-box">
                High Score
                <span id="high-score">0</span>
            </div>
        </div>
        
        <div class="game-screen" id="game-canvas">
            <!-- Future canvas/game grid goes here -->
            Game Loading...
        </div>
        
        <p class="game-description">
            Use arrow keys to control the snake. Eat food to grow longer 
            and increase your score. Don't hit the walls or yourself!
        </p>
    </div>
    
    <a href="../hub.html" class="button">Back to Hub</a>
</body>
</html>
